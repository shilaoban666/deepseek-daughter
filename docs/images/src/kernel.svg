<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1110" viewBox="0 0 1340 1110">
  <style>
    text { font-family: 'Microsoft YaHei UI', 'PingFang SC', 'Noto Sans SC', sans-serif; fill: #222; }
    .title { font-size: 26px; font-weight: 700; }
    .layer { font-size: 18px; font-weight: 600; fill: #555; }
    .h { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .s { font-size: 14px; fill: #666; text-anchor: middle; }
    .note { font-size: 15px; fill: #666; }
    .outer { fill: #efeeeb; stroke: #d6d4cf; stroke-width: 1.5; }
    .card { fill: #f6f5f2; stroke: #cfcdc7; stroke-width: 1.5; }
    .inner { fill: #f3f2ef; stroke: #d6d4cf; stroke-width: 1.5; }
    .hl { fill: #e3ebf5; stroke: #2f74d0; stroke-width: 2.5; }
    .hlcard { fill: #f2f6fb; stroke: #8fb0dc; stroke-width: 1.5; }
    .gw { fill: #fdf3e1; stroke: #d08a1e; stroke-width: 2.5; }
    .off { fill: #f8efee; stroke: #c98b84; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .offt { font-size: 15px; fill: #a2524a; }
    .dash { stroke-dasharray: 6 5; }
    .arrow { stroke: #a9a79f; stroke-width: 2.5; fill: none; }
    .garrow { stroke: #d08a1e; stroke-width: 2.5; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a9a79f"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d08a1e"/></marker>
  </defs>

  <text class="title" x="40" y="48">大肥鱼的内核：她的生命核心在主进程里，DSH 通过生命网关和她说话</text>

  <!-- 界面层 -->
  <rect class="outer" x="40" y="78" width="1260" height="152" rx="12"/>
  <text class="layer" x="66" y="112">界面层（Electron 窗口，用户看到的全部界面）</text>
  <g>
    <rect class="card" x="66" y="132" width="226" height="76" rx="10"/><text class="h" x="179" y="164">意识和记忆</text><text class="s" x="179" y="190">意识海 · 记忆 · 人格</text>
    <rect class="card" x="310" y="132" width="226" height="76" rx="10"/><text class="h" x="423" y="164">生命状态</text><text class="s" x="423" y="190">身体 · 递质 · 鲸鱼娘</text>
    <rect class="card" x="554" y="132" width="226" height="76" rx="10"/><text class="h" x="667" y="164">发现探索</text><text class="s" x="667" y="190">平台插件 · 内核页</text>
    <rect class="card" x="798" y="132" width="226" height="76" rx="10"/><text class="h" x="911" y="164">聊天栏</text><text class="s" x="911" y="190">流式回复 · “经内核”小标</text>
    <rect class="card" x="1042" y="132" width="232" height="76" rx="10"/><text class="h" x="1158" y="164">设置</text><text class="s" x="1158" y="190">Key 加密 · 名字 · 备份</text>
  </g>

  <line class="arrow" x1="670" y1="234" x2="670" y2="262" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="note" x="690" y="254">IPC（界面拿不到 Key 和令牌明文）</text>

  <!-- 主进程 -->
  <rect class="outer" x="40" y="268" width="1260" height="330" rx="12"/>
  <text class="layer" x="66" y="302">Electron 主进程（我们自己的代码，Apache-2.0）</text>

  <rect class="hl" x="66" y="320" width="1208" height="146" rx="12"/>
  <text x="90" y="352" style="font-size:19px;font-weight:700">生命核心</text>
  <text class="note" x="1250" y="352" text-anchor="end">桌面聊天栏和内核来的消息排同一个队：她只有一个身体、一份记忆</text>
  <g>
    <rect class="hlcard" x="90" y="368" width="180" height="78" rx="10"/><text class="h" x="180" y="400">心跳</text><text class="s" x="180" y="426">每分钟推进一次</text>
    <rect class="hlcard" x="286" y="368" width="180" height="78" rx="10"/><text class="h" x="376" y="400">身体</text><text class="s" x="376" y="426">消化 · 作息 · 八大系统</text>
    <rect class="hlcard" x="482" y="368" width="180" height="78" rx="10"/><text class="h" x="572" y="400">大脑</text><text class="s" x="572" y="426">14 脑区 · 7 递质 · PAD</text>
    <rect class="hlcard" x="678" y="368" width="180" height="78" rx="10"/><text class="h" x="768" y="400">记忆</text><text class="s" x="768" y="426">六层 · 日记 · 巩固</text>
    <rect class="hlcard" x="874" y="368" width="180" height="78" rx="10"/><text class="h" x="964" y="400">驱力 · 免疫</text><text class="s" x="964" y="426">主动找人 · 拦截教唆</text>
    <rect class="hlcard" x="1070" y="368" width="180" height="78" rx="10"/><text class="h" x="1160" y="400">预算</text><text class="s" x="1160" y="426">Token 用完就“累了”</text>
  </g>

  <rect class="gw" x="66" y="482" width="1208" height="96" rx="12"/>
  <text x="90" y="514" style="font-size:19px;font-weight:700">生命网关 gateway.js</text>
  <text class="note" x="90" y="544">接口和 DeepSeek 一样 · 只听 127.0.0.1 · 每次启动换随机令牌 · 只取最后一句用户消息交给 replyFrom()</text>
  <text class="note" x="90" y="566">DSH 的系统提示词和历史全部忽略 · 回复里永远没有 tool_calls · 重试的同一句话只让她听一次</text>

  <line class="garrow" x1="670" y1="602" x2="670" y2="640" marker-start="url(#g)" marker-end="url(#g)"/>
  <text class="note" x="690" y="626" style="fill:#a8691a">DeepSeek 格式的 HTTP：DSH 以为在调用 DeepSeek，其实是在和她说话</text>

  <!-- DSH 子进程 -->
  <rect class="outer" x="40" y="646" width="1260" height="272" rx="12"/>
  <text class="layer" x="66" y="680">DSH 子进程（BSD-3，0.0.1-rc.5 锁定；大肥鱼.exe 自己当 Node；数据目录在大肥鱼里，不碰 ~/.dsh）</text>
  <g>
    <rect class="card" x="66" y="700" width="290" height="76" rx="10"/><text class="h" x="211" y="732">JSON-RPC 服务</text><text class="s" x="211" y="758">内核页的输入框从这里进</text>
    <rect class="card" x="372" y="700" width="290" height="76" rx="10"/><text class="h" x="517" y="732">DeepSeek 适配器</text><text class="s" x="517" y="758">baseURL 指向生命网关</text>
    <rect class="card" x="678" y="700" width="290" height="76" rx="10"/><text class="h" x="823" y="732">智能体主干</text><text class="s" x="823" y="758">自带的工具全部关掉</text>
    <rect class="card dash" x="984" y="700" width="290" height="76" rx="10"/><text class="h" x="1129" y="732" fill="#888">通道插件（阶段 G）</text><text class="s" x="1129" y="758">QQ · 微信</text>
  </g>
  <rect class="off" x="66" y="792" width="1208" height="106" rx="12"/>
  <text x="90" y="822" style="font-size:16px;font-weight:600;fill:#a2524a">没有装：任何能动电脑的插件</text>
  <text class="offt" x="90" y="852">执行命令（bash、PowerShell）· 读写文件 · 网页抓取 · 子智能体 · MCP · 技能</text>
  <text class="note" x="90" y="880">配置按白名单生成，测试保证它们不会出现。接到 QQ 群以后，群里的人也没法借她操作你的电脑。</text>

  <line class="arrow" x1="670" y1="922" x2="670" y2="950" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="note" x="690" y="942">只有生命核心调用 DeepSeek；DSH 拿不到真的 Key</text>

  <!-- 外部 -->
  <rect class="outer" x="40" y="956" width="1260" height="134" rx="12"/>
  <text class="layer" x="66" y="988">外部世界（都不打进安装包）</text>
  <g>
    <rect class="card" x="66" y="1002" width="290" height="70" rx="10"/><text class="h" x="211" y="1032">DeepSeek API</text><text class="s" x="211" y="1056">用户自己的 Key</text>
    <rect class="card dash" x="372" y="1002" width="290" height="70" rx="10"/><text class="h" x="517" y="1032" fill="#888">QQ</text><text class="s" x="517" y="1056">NapCat（用户自装，阶段 G）</text>
    <rect class="card dash" x="678" y="1002" width="290" height="70" rx="10"/><text class="h" x="823" y="1032" fill="#888">微信</text><text class="s" x="823" y="1056">腾讯 iLink，扫码（阶段 G）</text>
    <rect class="card" x="984" y="1002" width="290" height="70" rx="10"/><text class="h" x="1129" y="1032">本机数据</text><text class="s" x="1129" y="1056">记忆 · 设置 · Key 加密</text>
  </g>
</svg>
