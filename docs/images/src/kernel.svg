<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1078" viewBox="0 0 1340 1078">
  <style>
    text { font-family: 'Microsoft YaHei UI', 'PingFang SC', 'Noto Sans SC', sans-serif; fill: #222; }
    .title { font-size: 26px; font-weight: 700; }
    .layer { font-size: 18px; font-weight: 600; fill: #555; }
    .h { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .s { font-size: 14px; fill: #666; text-anchor: middle; }
    .note { font-size: 15px; fill: #666; }
    .outer { fill: #efeeeb; stroke: #d6d4cf; stroke-width: 1.5; }
    .card { fill: #f6f5f2; stroke: #cfcdc7; stroke-width: 1.5; }
    .inner { fill: #f3f2ef; stroke: #d6d4cf; stroke-width: 1.5; }
    .hl { fill: #e3ebf5; stroke: #2f74d0; stroke-width: 2.5; }
    .hlcard { fill: #f2f6fb; stroke: #8fb0dc; stroke-width: 1.5; }
    .off { fill: #f8efee; stroke: #c98b84; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .offt { font-size: 15px; fill: #a2524a; }
    .dash { stroke-dasharray: 6 5; }
    .arrow { stroke: #a9a79f; stroke-width: 2.5; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a9a79f"/></marker>
  </defs>

  <text class="title" x="40" y="48">大肥鱼的内核：一个 exe，里面装着 DSH 和我们的生命核心</text>

  <!-- 界面层 -->
  <rect class="outer" x="40" y="78" width="1260" height="152" rx="12"/>
  <text class="layer" x="66" y="112">界面层（Electron 窗口，用户看到的全部界面）</text>
  <g>
    <rect class="card" x="66" y="132" width="226" height="76" rx="10"/><text class="h" x="179" y="164">思考记忆</text><text class="s" x="179" y="190">粒子大脑 · 记忆 · 人格</text>
    <rect class="card" x="310" y="132" width="226" height="76" rx="10"/><text class="h" x="423" y="164">生命状态</text><text class="s" x="423" y="190">身体 · 递质 · Token 钱包</text>
    <rect class="card" x="554" y="132" width="226" height="76" rx="10"/><text class="h" x="667" y="164">链接</text><text class="s" x="667" y="190">Key · 名字 · QQ · 微信</text>
    <rect class="card" x="798" y="132" width="226" height="76" rx="10"/><text class="h" x="911" y="164">聊天栏</text><text class="s" x="911" y="190">流式回复 · 主动消息</text>
    <rect class="card dash" x="1042" y="132" width="232" height="76" rx="10"/><text class="h" x="1158" y="164" fill="#888">动画（暂不开放）</text><text class="s" x="1158" y="190">房间 · 角色</text>
  </g>

  <line class="arrow" x1="670" y1="234" x2="670" y2="262" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="note" x="690" y="254">JSON-RPC（本机进程间通信）· 状态推送 · 聊天消息</text>

  <!-- DSH 运行时 -->
  <rect class="outer" x="40" y="268" width="1260" height="604" rx="12"/>
  <text class="layer" x="66" y="302">DSH 运行时（MIT，锁定版本；自定义配置，不带 DSH 自己的网页界面）</text>

  <!-- 生命核心 -->
  <rect class="hl" x="66" y="320" width="1208" height="146" rx="12"/>
  <text x="90" y="352" style="font-size:19px;font-weight:700">dsh-plugin-life · 自研生命核心</text>
  <text class="note" x="1250" y="352" text-anchor="end">所有入口的消息都先经过这里：她只有一个身体、一份记忆</text>
  <g>
    <rect class="hlcard" x="90" y="368" width="180" height="78" rx="10"/><text class="h" x="180" y="400">心跳</text><text class="s" x="180" y="426">每分钟推进一次</text>
    <rect class="hlcard" x="286" y="368" width="180" height="78" rx="10"/><text class="h" x="376" y="400">身体</text><text class="s" x="376" y="426">消化 · 作息 · 八大系统</text>
    <rect class="hlcard" x="482" y="368" width="180" height="78" rx="10"/><text class="h" x="572" y="400">大脑</text><text class="s" x="572" y="426">14 脑区 · 7 递质 · PAD</text>
    <rect class="hlcard" x="678" y="368" width="180" height="78" rx="10"/><text class="h" x="768" y="400">记忆</text><text class="s" x="768" y="426">六层 · SQLite · 日记</text>
    <rect class="hlcard" x="874" y="368" width="180" height="78" rx="10"/><text class="h" x="964" y="400">驱力</text><text class="s" x="964" y="426">想法队列 · 主动找人</text>
    <rect class="hlcard" x="1070" y="368" width="180" height="78" rx="10"/><text class="h" x="1160" y="400">人设注入</text><text class="s" x="1160" y="426">状态和记忆写进提示词</text>
  </g>

  <!-- DSH 自带 -->
  <rect class="inner" x="66" y="482" width="1208" height="116" rx="12"/>
  <text class="layer" x="90" y="510" style="font-size:16px">DSH 自带</text>
  <g>
    <rect class="card" x="90" y="522" width="220" height="60" rx="10"/><text class="h" x="200" y="548" style="font-size:16px">会话与持久化</text><text class="s" x="200" y="570">每个聊天的上下文</text>
    <rect class="card" x="326" y="522" width="220" height="60" rx="10"/><text class="h" x="436" y="548" style="font-size:16px">DeepSeek 适配器</text><text class="s" x="436" y="570">流式输出 · 用量</text>
    <rect class="card" x="562" y="522" width="220" height="60" rx="10"/><text class="h" x="672" y="548" style="font-size:16px">定时任务</text><text class="s" x="672" y="570">睡前日记 · 记忆巩固</text>
    <rect class="card" x="798" y="522" width="220" height="60" rx="10"/><text class="h" x="908" y="548" style="font-size:16px">Token 计量</text><text class="s" x="908" y="570">对应饱腹感和预算</text>
    <rect class="card" x="1034" y="522" width="216" height="60" rx="10"/><text class="h" x="1142" y="548" style="font-size:16px">SDK 服务</text><text class="s" x="1142" y="570">和界面通信</text>
  </g>

  <!-- 社区插件 -->
  <rect class="inner" x="66" y="614" width="1208" height="116" rx="12"/>
  <text class="layer" x="90" y="642" style="font-size:16px">精选社区插件（逐个审核许可证、权限和版本后锁定）</text>
  <g>
    <rect class="card" x="90" y="654" width="282" height="60" rx="10"/><text class="h" x="231" y="680" style="font-size:16px">QQ 通道</text><text class="s" x="231" y="702">OneBot 11（NapCat）或官方机器人</text>
    <rect class="card" x="388" y="654" width="282" height="60" rx="10"/><text class="h" x="529" y="680" style="font-size:16px">微信通道</text><text class="s" x="529" y="702">腾讯 iLink 官方接口</text>
    <rect class="card" x="686" y="654" width="282" height="60" rx="10"/><text class="h" x="827" y="680" style="font-size:16px">表情与语音</text><text class="s" x="827" y="702">可选，按需挑选</text>
    <rect class="card dash" x="984" y="654" width="266" height="60" rx="10"/><text class="h" x="1117" y="680" style="font-size:16px" fill="#888">更多平台</text><text class="s" x="1117" y="702">B 站 · 小说（阶段 4 起）</text>
  </g>

  <!-- 关闭的工具 -->
  <rect class="off" x="66" y="746" width="1208" height="106" rx="12"/>
  <text x="90" y="776" style="font-size:16px;font-weight:600;fill:#a2524a">关闭：DSH 默认带的编程工具</text>
  <text class="offt" x="90" y="806">执行命令（bash、PowerShell）· 读写文件 · 网页抓取 · 子智能体 · 工作区</text>
  <text class="note" x="90" y="834">陪伴用不上；接到 QQ 群后，开着这些工具等于让群里任何人都能借她操作你的电脑。</text>

  <line class="arrow" x1="670" y1="876" x2="670" y2="904" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="note" x="690" y="896">消息收发 · 推理请求</text>

  <!-- 外部 -->
  <rect class="outer" x="40" y="910" width="1260" height="148" rx="12"/>
  <text class="layer" x="66" y="944">外部世界（都不打进安装包）</text>
  <g>
    <rect class="card" x="66" y="962" width="226" height="76" rx="10"/><text class="h" x="179" y="994">QQ</text><text class="s" x="179" y="1020">NapCat（用户自装）或官方机器人</text>
    <rect class="card" x="310" y="962" width="226" height="76" rx="10"/><text class="h" x="423" y="994">微信</text><text class="s" x="423" y="1020">腾讯 iLink，扫码登录</text>
    <rect class="card" x="554" y="962" width="226" height="76" rx="10"/><text class="h" x="667" y="994">DeepSeek API</text><text class="s" x="667" y="1020">用户自己的 Key</text>
    <rect class="card dash" x="798" y="962" width="226" height="76" rx="10"/><text class="h" x="911" y="994" fill="#888">内容平台</text><text class="s" x="911" y="1020">B 站 · 小说 · 小红书（以后）</text>
    <rect class="card" x="1042" y="962" width="232" height="76" rx="10"/><text class="h" x="1158" y="994">本机数据</text><text class="s" x="1158" y="1020">记忆 · 设置 · Key 加密</text>
  </g>
</svg>
