<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大肥鱼 · 界面原型 v2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 可点击原型，全部是示例数据。brain.jpg 由 Anderson Winkler 的皮层网格（CC BY-SA 3.0）渲染而来，署名见 apps/desktop/assets/cortex/LICENSE-ATTRIBUTION.md。 -->
<div class="app">
  <nav class="rail" id="rail"></nav>
  <main class="main">
    <div class="bar">
      <div class="tabs" id="tabs"></div>
      <div class="sim" id="sim"></div>
    </div>
    <div class="page" id="page"></div>
  </main>
  <aside class="chat">
    <header><svg viewBox="0 0 40 40"><use href="#whale"/></svg><b>小鲸鱼</b><small id="chatStatus"></small></header>
    <div class="msgs" id="msgs"></div>
    <div class="say" id="say"></div>
    <div class="composer"><input placeholder="和她说点什么…" aria-label="输入消息"><button class="btn">发送</button></div>
  </aside>
</div>
<div class="foot">原型 · 示例数据</div>

  <path d="M8 25c3 3 8 4 12 4s8-1 10-3c-2 4-6 6-11 6-5 0-9-2-11-7z" fill="#fff" opacity=".55"/><circle cx="13" cy="19" r="1.6" fill="#0b1426"/>
</symbol></svg>
<script src="data.js"></script>
<script src="app.js"></script>

</html>
